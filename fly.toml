app = "resume-toolchain"
primary_region = "sin"  # Singapore - closest to you in India

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Note: No persistent storage needed - PDFs are streamed directly to browser
# and cached in memory (1 hour TTL for ATS analysis)

[env]
  PORT = "8000"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
  # Note: You may need more memory (2048) for LaTeX compilation
