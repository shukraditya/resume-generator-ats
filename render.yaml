services:
  - type: web
    name: resume-toolchain
    runtime: python
    plan: standard
    buildCommand: |
      apt-get update && apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: KIMI_API_KEY
        sync: false  # Set this in Render dashboard
    # Note: No disk needed - PDFs are streamed directly to browser
    # and cached in memory (1 hour TTL for ATS analysis)
